# Gradle 构建环境配置
# 官方文档: https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Gradle 守护进程 JVM 参数
# -Xmx2g: 默认堆仅 512MB,多模块 + BOM 解析 + 注解处理器(Lombok / MapStruct / Spring 配置元数据)
#         极易触发 OOM 导致 daemon 重启或编译变慢,提升至 2GB
# -Dfile.encoding=UTF-8: 强制 UTF-8 编码,避免跨平台 / CI 环境 locale 差异导致中文注释或资源乱码
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 并行构建: 模块间无依赖关系的任务并发执行,显著缩短多模块构建时间
org.gradle.parallel=true

# 构建缓存: 复用历史任务输出(本地缓存),增量构建提速
org.gradle.caching=true

# 配置缓存: 缓存项目配置阶段结果,二次构建跳过 configuration phase
# 注意: 与 org.gradle.configureondemand 功能重叠,不要同时启用
org.gradle.configuration-cache=true
