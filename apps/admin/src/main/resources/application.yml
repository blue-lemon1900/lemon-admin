# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 80
  servlet:
    # 应用的访问路径
    context-path: /

# Spring配置
spring:
  profiles:
    active: dev
  application:
    name: Lemon-Admin
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: true
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# 日志配置
logging:
  config: classpath:logback-plus.xml
  file:
    # 日志文件位置
    path: ./apps/admin/logs
  level:
    org.lemon: info
    org.springframework: warn
    org.springframework.security: warn
    org.mybatis.spring.mapper: warn

--- # MyBatisPlus 配置
mybatis-plus:
  # 项目扩展:是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enable-logic-delete: true
  # 项目扩展:Mapper 接口扫描包,支持 ** 通配
  mapper-package: org.lemon.**.mapper
  # 实体扫描,多个 package 用逗号或者分号分隔
  type-aliases-package: org.lemon.**.domain
  # 对应的 XML 文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  global-config:
    db-config:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      id-type: ASSIGN_ID

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # 自定义配置信息;统一以 lemon 前缀承载,便于一眼区分项目自定义与三方/官方配置
lemon:
  # 权限认证
  security:
    token-header: Authorization
    token-parameter: token
    permit-all-urls:
      - /favicon.ico    # 公共路径
    # 新密码编码使用的算法 id;切换该值即可迁移加密算法,老前缀密码仍可校验并按需自动升级
    # 取值: argon2 (默认,推荐) / bcrypt / pbkdf2 / scrypt
    password-encoder-id: argon2
  # 验证码
  captcha:
    # 是否启用验证码校验
    enable: true
    # 验证码类型 math 数组计算 char 字符验证
    type: math
    # 数字验证码位数
    numberLength: 1
    # 字符验证码长度
    charLength: 4
  # 数据加密
  encrypt:
    # MyBatis 字段加密
    mybatis:
      # 是否开启加密
      enable: false
      # 默认加密算法
      algorithm: BASE64
      # 编码方式 BASE64/HEX。默认BASE64
      encode: BASE64
      # 安全秘钥 对称算法的秘钥 如：AES，SM4
      password:
      # 公私钥 非对称算法的公私钥 如：SM2，RSA
      publicKey:
      privateKey:
    # API 接口加解密
    api:
      # 是否开启全局接口加密
      enabled: true
      # AES 加密头标识
      headerFlag: encrypt-key
      # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
      # 对应前端解密私钥 
      publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
      # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
      # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
      privateKey: 
  # 防止XSS攻击
  xss:
    # 过滤开关
    enabled: true
    # 排除链接
    excludeUrls:
      - /system/notice
  # SSE 推送
  sse:
    enabled: true
    path: /resource/sse
  # 多租户
  tenant:
    # 是否开启
    enable: true
    # 排除表
    excludes:
      - sys_menu
      - sys_tenant
      - sys_tenant_package
      - sys_role_dept
      - sys_role_menu
      - sys_user_post
      - sys_user_role
      - sys_client
      - sys_oss_config